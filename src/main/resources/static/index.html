<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GyroStars — Telegram Mini App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Lottie Web Player for Animated Telegram Emojis -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
              950: '#0b1120'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Custom App CSS -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-[#0B1120] text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

  <!-- Fullscreen Splash / Loading Screen with Animated Custom Emoji -->
  <div id="splash-screen" class="fixed inset-0 bg-[#0B1120] z-[99999] flex flex-col items-center justify-center transition-all duration-500 ease-out">
    <div class="relative flex flex-col items-center justify-center space-y-4">
      <div id="splash-lottie" class="w-32 h-32 flex items-center justify-center animate-float"></div>
      <div class="text-center space-y-1.5">
        <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-sky-300 to-indigo-400">
          GyroStars
        </h1>
        <p class="text-xs text-slate-400 font-medium">Yuklanmoqda...</p>
      </div>
      <!-- Liquid Mini Progress bar -->
      <div class="w-36 h-1.5 bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-700/60 mt-2">
        <div class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full animate-pulse w-full"></div>
      </div>
    </div>
  </div>

  <!-- Ambient background glow -->
  <div class="ambient-glow"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- App Wrapper (Mobile Constrained) -->
  <div class="max-w-md mx-auto min-h-screen flex flex-col relative px-3.5 pt-3">

    <!-- ------------------------------------------------------------- -->
    <!-- 1. TOP HEADER (Consistent across all pages)                   -->
    <!-- ------------------------------------------------------------- -->
    <header class="glass-card p-3 mb-3.5 flex items-center justify-between sticky top-2 z-40 bg-slate-900/90 shadow-lg shadow-black/40">
      <!-- Left: Avatar + Name + Verified Badge + Copyable ID -->
      <div class="flex items-center gap-2.5">
        <div id="header-avatar" 
             class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 text-white font-extrabold flex items-center justify-center text-sm shadow-md shadow-blue-500/20 border border-blue-400/30">
          👤
        </div>
        <div>
          <div class="flex items-center gap-1.5 leading-none">
            <span id="header-name" class="font-extrabold text-sm text-white tracking-tight">Yuklanmoqda...</span>
            <span id="header-badge" class="w-4 h-4 flex items-center justify-center"></span>
          </div>
          <div onclick="copyToClipboard(STATE.user.userId ? STATE.user.userId.toString() : '', 'ID nusxalandi!')" 
               class="flex items-center gap-1 mt-1 cursor-pointer text-slate-400 hover:text-slate-200 transition-colors">
            <span id="header-id" class="text-[11px] font-mono font-medium">ID: —</span>
            <svg class="w-3 h-3 text-slate-500 hover:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Right: Balance Pill with Blue Plus Button -->
      <div class="flex items-center gap-1.5">
        <div onclick="openDepositModal()" 
             class="cursor-pointer bg-slate-950/80 border border-slate-700/80 hover:border-blue-500/60 rounded-xl px-3 py-1.5 flex items-center gap-1.5 transition-all shadow-inner">
          <span class="text-xs">💳</span>
          <span id="header-balance" class="text-xs font-black text-white">0 so'm</span>
        </div>
        <button onclick="openDepositModal()" 
                class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white flex items-center justify-center text-lg font-black shadow-md shadow-blue-600/30 transition-all active:scale-95">
          +
        </button>
      </div>
    </header>

    <!-- ------------------------------------------------------------- -->
    <!-- 2. MAIN DYNAMIC CONTENT CONTAINER                             -->
    <!-- ------------------------------------------------------------- -->
    <main id="main-content" class="flex-1 pb-4">
      <!-- Injected dynamically by app.js -->
    </main>

    <!-- ------------------------------------------------------------- -->
    <!-- 3. STICKY BOTTOM NAVIGATION (5 Tabs with Animated Emojis)    -->
    <!-- ------------------------------------------------------------- -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-center pb-safe">
      <div class="w-full max-w-md bg-slate-900/95 backdrop-blur-xl border-t border-slate-800/90 px-3 py-1.5 flex items-center justify-around shadow-2xl">
        <div id="bottom-nav" class="w-full flex items-center justify-between">
          <!-- Injected dynamically by app.js -->
        </div>
      </div>
    </nav>

  </div>

  <!-- ------------------------------------------------------------- -->
  <!-- 4. MODALS & BOTTOM SHEETS                                     -->
  <!-- ------------------------------------------------------------- -->
  <div id="generic-modal" class="modal-backdrop">
    <div class="modal-sheet" id="modal-content">
      <!-- Dynamic modal content -->
    </div>
  </div>

  <!-- App Core JS -->
  <script src="js/app.js"></script>
</body>
</html>
